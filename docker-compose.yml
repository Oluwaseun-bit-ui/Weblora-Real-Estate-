version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: realestate
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: realestate
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    env_file: ./backend/.env
    depends_on: [db, redis]

  celery:
    build: ./backend
    command: celery -A config worker -l info
    volumes: ["./backend:/app"]
    env_file: ./backend/.env
    depends_on: [db, redis]

  celery-beat:
    # Wakes up nightly (02:00 Lagos) to sync listings from authorized sources.
    build: ./backend
    command: celery -A config beat -l info
    volumes: ["./backend:/app"]
    env_file: ./backend/.env
    depends_on: [db, redis]

  frontend:
    build: ./frontend
    command: npm run dev -- --host
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
